<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EdgeSight Dashboard</title>
<style>
:root{--bg:#0b0f19;--panel:#131926;--accent:#00d4aa;--text:#c8d0e0;--muted:#7a8398;--alert:#ff4d6d;--warn:#ffd166;}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
header{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.5rem;border-bottom:1px solid #1c2333;background:var(--panel)}
header h1{margin:0;font-size:1.25rem;color:var(--accent)}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1rem;padding:1rem}
.card{background:var(--panel);border-radius:8px;padding:1rem;border:1px solid #1c2333}
.card h3{margin:0 0 .25rem;font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.card .value{font-size:1.5rem;font-weight:700}
main{display:grid;grid-template-columns:1fr 360px;gap:1rem;padding:0 1rem 1rem}
@media(max-width:900px){main{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th,td{padding:.6rem .5rem;text-align:left;border-bottom:1px solid #1c2333}
th{color:var(--muted);font-weight:600}
tr:hover{background:#1a2235}
.badge{display:inline-block;padding:.15rem .45rem;border-radius:12px;font-size:.7rem;font-weight:700;text-transform:uppercase}
.badge-alert{background:rgba(255,77,109,.15);color:var(--alert)}
.badge-anomaly{background:rgba(255,209,102,.15);color:var(--warn)}
.badge-flow{background:rgba(0,212,170,.15);color:var(--accent)}
#query{height:80px;width:100%;background:var(--panel);border:1px solid #1c2333;color:var(--text);border-radius:6px;padding:.5rem;font-family:monospace}
button{background:var(--accent);color:#000;border:none;padding:.5rem 1rem;border-radius:6px;font-weight:700;cursor:pointer;margin-top:.5rem}
button:hover{filter:brightness(1.1)}
#result{white-space:pre-wrap;font-family:monospace;font-size:.8rem;background:var(--panel);border:1px solid #1c2333;border-radius:6px;padding:.5rem;min-height:120px;margin-top:.5rem}
.hidden{display:none}
</style>
</head>
<body>
<header>
  <h1>EdgeSight</h1>
  <div><span id="status" class="badge badge-flow">running</span></div>
</header>
<div class="metrics">
  <div class="card"><h3>Flows / sec</h3><div class="value" id="fps">-</div></div>
  <div class="card"><h3>Bytes / sec</h3><div class="value" id="bps">-</div></div>
  <div class="card"><h3>Active Flows</h3><div class="value" id="flows">-</div></div>
  <div class="card"><h3>Alerts</h3><div class="value" id="alerts">-</div></div>
</div>
<main>
  <section class="card">
    <h3>Recent Events</h3>
    <table>
      <thead><tr><th>Time</th><th>Kind</th><th>Sev</th><th>Source</th><th>Title</th><th>Message</th></tr></thead>
      <tbody id="events"></tbody>
    </table>
  </section>
  <aside class="card">
    <h3>SQL Query</h3>
    <textarea id="query">SELECT * FROM events ORDER BY timestamp DESC LIMIT 10</textarea>
    <button onclick="runQuery()">Run</button>
    <div id="result"></div>
  </aside>
</main>
<script>
const fmtTime=t=>new Date(t).toLocaleTimeString();
const badge=k=>{
  if(k==='alert') return '<span class="badge badge-alert">alert</span>';
  if(k==='anomaly') return '<span class="badge badge-anomaly">anomaly</span>';
  return '<span class="badge badge-flow">'+k+'</span>';
};
async function refreshMetrics(){
  const r=await fetch('/api/metrics');
  const m=await r.json();
  document.getElementById('fps').textContent=m.flows_per_sec.toFixed(1);
  document.getElementById('bps').textContent=formatBytes(m.bytes_per_sec)+'/s';
  document.getElementById('flows').textContent=m.active_flows;
  document.getElementById('alerts').textContent=m.alerts;
}
function formatBytes(b){if(b<1024)return b.toFixed(0)+' B';if(b<1024*1024)return (b/1024).toFixed(1)+' KB';return (b/(1024*1024)).toFixed(1)+' MB';}
async function refreshEvents(){
  const r=await fetch('/api/events?limit=25');
  const ev=await r.json();
  const tb=document.getElementById('events');
  tb.innerHTML=ev.map(e=>`<tr><td>${fmtTime(e.timestamp)}</td><td>${badge(e.kind)}</td><td>${e.severity}</td><td>${e.source}</td><td>${escapeHtml(e.title)}</td><td>${escapeHtml(e.message)}</td></tr>`).join('');
}
async function runQuery(){
  const q=document.getElementById('query').value;
  const r=await fetch('/api/query',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({q})
  });
  const data=await r.json();
  document.getElementById('result').textContent=JSON.stringify(data,null,2);
}
function escapeHtml(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
setInterval(()=>{refreshMetrics();refreshEvents();},2000);
refreshMetrics();refreshEvents();
</script>
</body>
</html>
